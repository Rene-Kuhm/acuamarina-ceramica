[build]
builder = "NIXPACKS"

[deploy]
# Comando correcto para Next.js 15
startCommand = "cd frontend && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# Variables de entorno específicas para Server Actions
[env]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
# Fuerza regeneración de IDs de Server Actions
NEXT_PRIVATE_STATIC_CACHE = "false"
