[build]
builder = "NIXPACKS"

[deploy]
# Configuración para Next.js con Server Actions
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# Variables de entorno para evitar conflictos de Server Actions
[env]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
# Fuerza regeneración de Server Actions IDs
NEXT_PRIVATE_FORCE_STATIC_CACHE = "false"

[build.env]
NODE_ENV = "production"